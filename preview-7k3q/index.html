<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OX Trading 會員</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04060d">
<link rel="icon" type="image/png" href="../assets/img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;900&family=Noto+Serif+TC:wght@500;700;900&family=EB+Garamond:ital,wght@1,500&family=JetBrains+Mono:wght@500&family=Fredoka:wght@600&family=Bebas+Neue&family=Yellowtail&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../home/home.css">
</head>
<body class="ox-home" data-root="../">
<canvas id="fx" aria-hidden="true"></canvas>

<header class="oh-top">
  <button type="button" class="oh-round oh-menu" aria-label="開啟選單" aria-controls="oh-drawer" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg>
  </button>
  <a class="oh-brand" href="#top" aria-label="OX Trading 回到最上面"><span class="oh-logo" data-logo></span><b>OX Trading</b></a>
  <button type="button" class="oh-round oh-snd" aria-label="聲音開關" aria-pressed="true">
    <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
</header>

<main id="top">
  <!-- 第一頁：宇宙。黑卡和 LINE 兩格一進來就能點，不等任何動畫 -->
  <section class="oh-hero" aria-labelledby="oh-title">
    <h1 class="oh-title" id="oh-title"><span>歡迎加入</span> OX Trading 會員</h1>

    <button type="button" class="oh-join" data-join aria-label="註冊成為 OX 會員，開始註冊">
      <span class="oh-card" data-card>
        <span class="oh-card-art" aria-hidden="true" data-art></span>
        <span class="oh-card-sheen" aria-hidden="true"></span>
        <span class="oh-card-top"><span class="oh-logo" data-logo></span><em>OX Trading</em><i>MEMBER</i></span>
        <span class="oh-card-no" aria-hidden="true">NO. •••• ••••</span>
        <strong class="oh-card-title">註冊成為 OX 會員</strong>
        <span class="oh-card-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </span>
      <span class="oh-join-info">
        <span class="oh-join-perks" data-perks><span>進階教材</span><span>OX 加密進階功能</span></span>
        <span class="oh-join-rule"><b data-rule>完成 KYC、淨入金滿 100 USDT</b><small data-rule-note>系統根據交易所後台達標發送</small></span>
      </span>
    </button>

    <div class="oh-lines" data-lines></div>

    <a class="oh-hint" href="#teachers"><span>往下滑</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
  </section>

  <div class="oh-bridge" aria-hidden="true"></div>

  <!-- 第二頁：黑底。五位小老師，大小一樣、各自的風格 -->
  <section class="oh-teachers" id="teachers" aria-labelledby="oh-t-title">
    <h2 class="oh-h2 oh-rv" id="oh-t-title">我們的小老師們</h2>
    <p class="oh-sub oh-rv">點一位，進他的頁面</p>
    <div class="oh-tlist" data-teachers></div>
  </section>

  <!-- K 線轉場：黑底 → 白金 -->
  <section class="oh-kbridge" id="kbridge" aria-hidden="true">
    <div class="oh-kstage"><canvas id="kchart"></canvas></div>
  </section>

  <!-- 第三頁：白金。作品、交易法，最後再放一次黑卡和 LINE 兩格 -->
  <section class="oh-sec oh-light" id="works" data-works></section>
  <section class="oh-sec oh-light" id="methods" data-methods></section>
  <section class="oh-end oh-light" id="end" data-end></section>
</main>

<canvas id="kglass" aria-hidden="true"></canvas>

<script src="../home/data.js"></script>
<script src="../home/btc.js"></script>
<script src="../js/videos.js"></script>
<script src="../home/app.js"></script>
<script src="../home/kline.js"></script>
<script src="../home/join.js"></script>
<script src="../home/fx.js"></script>
</body>
</html>
